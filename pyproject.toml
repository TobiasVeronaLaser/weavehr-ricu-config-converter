[project]
name = "openicu-ricu-converter"
version = "0.2.0"
description = "Generate OpenICU extraction and concept configs from RICU JSON dictionaries."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
    "polars>=1.0",
    "jupyter>=1.0",
]

[project.scripts]
openicu-ricu-convert = "openicu_ricu_converter.cli:main"
openicu-ricu-compare-outputs = "openicu_ricu_converter.validation.compare_cli:main"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]
